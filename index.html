<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de documentos</title>
<meta name="description" content="Formulário de cadastro dos dados do documento.">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <div class="container topo__conteudo">
    <a class="marca" href="index.html">
      <span class="marca__icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7.5 3.2v5.1c0 4.4-3.1 8.4-7.5 9.7-4.4-1.3-7.5-5.3-7.5-9.7V6.2z"></path>
          <path d="M9 12.2l2.1 2.1L15.4 10"></path>
        </svg>
      </span>
      <span class="marca__texto">Cadastro de documentos</span>
    </a>
  </div>
</header>

<main class="container principal">

  <section class="hero">
    <h1>Dados do documento</h1>
    <p class="hero__texto">
      Preencha os campos abaixo com os dados que serão impressos no documento.
    </p>
  </section>

  <section class="cartao" aria-labelledby="titulo-form">
    <h2 id="titulo-form" class="cartao__titulo">Informações do aluno</h2>

    <form class="formulario" id="form-dados" novalidate>

      <div class="grade">

        <div class="grupo grupo--largo">
          <label class="rotulo" for="nome">Nome</label>
          <input class="campo__entrada" type="text" id="nome" name="nome"
                 placeholder="Nome completo" autocomplete="off" autofocus>
        </div>

        <div class="grupo grupo--largo">
          <label class="rotulo" for="curso">Curso</label>
          <input class="campo__entrada" type="text" id="curso" name="curso"
                 placeholder="Nome do curso" autocomplete="off">
        </div>

        <div class="grupo">
          <label class="rotulo" for="matricula">Matrícula</label>
          <input class="campo__entrada campo__entrada--mono" type="text"
                 id="matricula" name="matricula" inputmode="numeric"
                 placeholder="00000000000" autocomplete="off" spellcheck="false">
        </div>

        <div class="grupo">
          <label class="rotulo" for="cpf">CPF</label>
          <input class="campo__entrada campo__entrada--mono" type="text"
                 id="cpf" name="cpf" inputmode="numeric"
                 placeholder="000.000.000-00" autocomplete="off" spellcheck="false">
        </div>

      </div>

      <div class="acoes">
        <button class="botao botao--ok" type="submit">
          <span class="botao__marca" aria-hidden="true">OK</span>
          <span>Teste Teste</span>
        </button>
      </div>

    </form>
  </section>

  <!-- Confirmação inserida pelo JavaScript -->
  <div id="resultado" aria-live="polite"></div>

</main>

<footer class="rodape">
  <div class="container">
    <p>Projeto pessoal de estudo &middot; <span id="ano">2026</span></p>
    <p class="rodape__aviso">Uso interno. Dados fictícios, sem vínculo com qualquer instituição de ensino.</p>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
